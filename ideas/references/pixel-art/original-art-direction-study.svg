<text x="92" y="700" fill="#F5F1E8" font-family="Georgia,serif" font-size="32" shape-rendering="geometricPrecision">A visual language, not a borrowed identity.</text><text x="92" y="744" fill="#D2D8E8" font-family="Arial,sans-serif" font-size="17" shape-rendering="geometricPrecision">Limited palette · clear silhouettes · original geometry · consistent scale</text><text x="92" y="773" fill="#D2D8E8" font-family="Arial,sans-serif" font-size="13" shape-rendering="geometricPrecision">Abstract study only. Do not reproduce protected characters, logos, covers or signature compositions.</text>
