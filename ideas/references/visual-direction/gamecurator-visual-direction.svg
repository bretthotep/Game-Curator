<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">GameCurator visual direction reference board</title><desc id="desc">An original editorial museum design direction with warm paper, ink navy, electric blue, persimmon, lime accents, typographic hierarchy and abstract game-art tiles.</desc>
<defs><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3558E8"/><stop offset="1" stop-color="#182A71"/></linearGradient><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB05A"/><stop offset="1" stop-color="#E95D3F"/></linearGradient><pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="0.7" fill="#16213A" opacity=".09"/><circle cx="19" cy="21" r=".6" fill="#16213A" opacity=".06"/></pattern></defs>
<rect width="1440" height="900" fill="#F5F1E8"/><rect width="1440" height="900" fill="url(#grain)"/>
<text x="78" y="78" fill="#20283C" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">GAMECURATOR / VISUAL EXPLORATION 01</text>
<text x="76" y="183" fill="#20283C" font-family="Georgia,serif" font-size="94" font-weight="bold">Every game has</text><text x="76" y="278" fill="#20283C" font-family="Georgia,serif" font-size="94" font-weight="bold">a story.</text>
<path d="M80 315 H1360" stroke="#20283C" stroke-width="1" opacity=".35"/>
<text x="82" y="363" fill="#20283C" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">ART DIRECTION</text><text x="82" y="400" fill="#555B68" font-family="Arial,sans-serif" font-size="20">Editorial · tactile · curious · precise</text>
<rect x="80" y="447" width="248" height="260" rx="8" fill="url(#blue)"/><circle cx="203" cy="562" r="73" fill="#C7F06D"/><path d="M150 598 L202 497 L256 598 Z" fill="#F5F1E8"/><circle cx="203" cy="562" r="19" fill="#E95D3F"/><text x="98" y="681" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">DISCOVERY</text>
<rect x="350" y="447" width="248" height="260" rx="8" fill="#E95D3F"/><path d="M390 490 H558 V612 H390 Z" fill="#F5F1E8"/><path d="M410 510 L538 590 M538 510 L410 590" stroke="#20283C" stroke-width="9"/><circle cx="474" cy="551" r="28" fill="#C7F06D"/><text x="368" y="681" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">MEMORY</text>
<rect x="620" y="447" width="248" height="260" rx="8" fill="#C7F06D"/><path d="M665 616 Q745 475 823 616" fill="none" stroke="#20283C" stroke-width="11"/><circle cx="744" cy="533" r="37" fill="#3558E8"/><rect x="723" y="577" width="42" height="58" rx="7" fill="#E95D3F"/><text x="638" y="681" fill="#20283C" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">COLLECTION</text>
<text x="928" y="470" fill="#20283C" font-family="Georgia,serif" font-size="35">A digital museum,</text><text x="928" y="513" fill="#20283C" font-family="Georgia,serif" font-size="35">not a spreadsheet.</text>
<text x="930" y="564" fill="#555B68" font-family="Arial,sans-serif" font-size="18">Let the objects lead.</text><text x="930" y="592" fill="#555B68" font-family="Arial,sans-serif" font-size="18">Make the history discoverable.</text><text x="930" y="620" fill="#555B68" font-family="Arial,sans-serif" font-size="18">Keep ownership details clear.</text>
<rect x="925" y="662" width="115" height="28" rx="14" fill="#20283C"/><text x="943" y="681" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="12">PAPER / INK</text><rect x="1050" y="662" width="104" height="28" rx="14" fill="#3558E8"/><text x="1068" y="681" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="12">COBALT</text><rect x="1164" y="662" width="98" height="28" rx="14" fill="#E95D3F"/><text x="1180" y="681" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="12">PERSIMMON</text><rect x="1272" y="662" width="85" height="28" rx="14" fill="#C7F06D"/><text x="1291" y="681" fill="#20283C" font-family="Arial,sans-serif" font-size="12">CITRUS</text>
<text x="80" y="812" fill="#20283C" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">REFERENCE ONLY · ORIGINAL ABSTRACT ART · NOT A FINAL APPROVED DESIGN</text><text x="80" y="845" fill="#555B68" font-family="Arial,sans-serif" font-size="14">Use as a discussion starter for mood, hierarchy, colour and tone. Validate contrast and accessibility before implementation.</text>
</svg>