<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
<title id="title">GameCurator history exhibit concept</title><desc id="desc">An editorial history exhibit concept with a fictional game, timeline, sourced-claim labels and a clearly separated evidence panel.</desc>
<rect width="1440" height="1000" fill="#F5F1E8"/><rect x="50" y="38" width="1340" height="924" rx="16" fill="#FFFCF5" stroke="#DAD5CB"/>
<text x="94" y="88" fill="#20283C" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">GAMECURATOR / EXHIBIT STUDY</text><text x="94" y="153" fill="#3558E8" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">THE STORY BEHIND THE OBJECT</text>
<text x="92" y="220" fill="#20283C" font-family="Georgia,serif" font-size="57" font-weight="bold">A world beyond</text><text x="92" y="282" fill="#20283C" font-family="Georgia,serif" font-size="57" font-weight="bold">the cartridge.</text>
<text x="95" y="326" fill="#666B77" font-family="Arial,sans-serif" font-size="18">A sample editorial layout for a fictional game release.</text>
<rect x="95" y="367" width="610" height="325" rx="12" fill="#20283C"/><circle cx="400" cy="520" r="105" fill="#3558E8"/><path d="M300 570 L400 400 L500 570 Z" fill="#C7F06D"/><circle cx="400" cy="520" r="30" fill="#E95D3F"/><path d="M155 640 Q400 340 645 640" fill="none" stroke="#F5F1E8" stroke-width="3" opacity=".7"/><text x="122" y="658" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">ILLUSTRATIVE ART · FICTIONAL SUBJECT</text>
<text x="95" y="740" fill="#20283C" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">EXHIBIT SECTIONS</text><text x="95" y="783" fill="#20283C" font-family="Georgia,serif" font-size="24">01 — The idea</text><text x="95" y="821" fill="#20283C" font-family="Georgia,serif" font-size="24">02 — The release</text><text x="95" y="859" fill="#20283C" font-family="Georgia,serif" font-size="24">03 — The afterlife</text>
<rect x="758" y="367" width="530" height="234" rx="12" fill="#F1EEE6"/><text x="790" y="407" fill="#20283C" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">TIMELINE</text><path d="M806 450 V562" stroke="#A9ACB4" stroke-width="3"/><circle cx="806" cy="461" r="8" fill="#3558E8"/><circle cx="806" cy="508" r="8" fill="#E95D3F"/><circle cx="806" cy="555" r="8" fill="#4DAA91"/><text x="832" y="466" fill="#20283C" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Concept announced</text><text x="832" y="486" fill="#666B77" font-family="Arial,sans-serif" font-size="13">Date precision and source required</text><text x="832" y="513" fill="#20283C" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Physical release</text><text x="832" y="533" fill="#666B77" font-family="Arial,sans-serif" font-size="13">Region and edition must be identified</text><text x="832" y="560" fill="#20283C" font-family="Arial,sans-serif" font-size="16" font-weight="bold">Community preservation</text><text x="832" y="580" fill="#666B77" font-family="Arial,sans-serif" font-size="13">Attributed report, not assumed fact</text>
<rect x="758" y="623" width="530" height="236" rx="12" fill="#FFFFFF" stroke="#DAD5CB"/><text x="790" y="666" fill="#20283C" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">EVIDENCE &amp; CLAIMS</text><rect x="790" y="690" width="118" height="27" rx="13" fill="#DDE8FF"/><text x="805" y="708" fill="#233D98" font-family="Arial,sans-serif" font-size="12">SOURCE-LINKED</text><text x="790" y="746" fill="#20283C" font-family="Arial,sans-serif" font-size="16">Claim summary appears here, linked to a</text><text x="790" y="770" fill="#20283C" font-family="Arial,sans-serif" font-size="16">specific source passage and review status.</text><path d="M790 790 H1255" stroke="#DAD5CB"/><text x="790" y="822" fill="#666B77" font-family="Arial,sans-serif" font-size="13">Example source label: publication · date · link</text>
<text x="96" y="920" fill="#6A6F7A" font-family="Arial,sans-serif" font-size="14">CONCEPT ONLY · FICTIONAL TIMELINE · NO HISTORICAL CLAIMS OR SOURCES ARE ASSERTED</text>
